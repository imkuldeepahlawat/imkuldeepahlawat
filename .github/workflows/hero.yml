name: Generate hero assets (ASCII portrait + 3D wordmark)

on:
  push:
    branches: [main]
    paths:
      - "assets/photo.jpg"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/hero.yml"
  schedule:
    - cron: "0 3 * * *" # daily refresh for the contribution graph
  workflow_dispatch:

concurrency:
  group: publish-output-branch
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout scripts + photo (main)
        uses: actions/checkout@v4
        with:
          path: src

      - name: checkout existing output branch (preserves snake.svg etc.)
        uses: actions/checkout@v4
        with:
          ref: output
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r src/requirements.txt

      - name: generate kuldeep-ascii.svg
        run: |
          cd src
          python scripts/prep_photo.py assets/photo.jpg
          python scripts/make_ascii_svg.py --out ../dist/kuldeep-ascii.svg

      - name: generate wordmark.svg
        run: |
          cd src
          python scripts/make_wordmark_svg.py --mode decode --out ../dist/wordmark.svg

      - name: generate contrib-heatmap.svg
        run: |
          cd src
          python scripts/fetch_contributions.py --out data/contributions.json
          python scripts/make_contrib_graph.py --in data/contributions.json --out ../dist/contrib-heatmap.svg

      - name: drop nested .git from the checked-out dist/ before publishing
        run: |
          rm -rf dist/.git
          echo "dist/ contents about to be published:"
          ls -la dist/

      - name: push dist/ to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
