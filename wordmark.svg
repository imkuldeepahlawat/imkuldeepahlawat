<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 172" width="274" height="172"><style>text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 56px; font-weight: 700; fill: #58a6ff; }
    .ch { opacity: 0; animation: flicker 260ms linear forwards; }
    @keyframes flicker {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      24%  { opacity: 0; }
      36%  { opacity: 1; }
      48%  { opacity: 0.3; }
      60%  { opacity: 1; }
      100% { opacity: 1; }
    }
    .cursor {
      opacity: 0;
      animation: blink 1s steps(1, end) 1055ms infinite;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }</style><text><tspan class="ch" x="18" y="62.2" style="animation-delay:60ms">K</tspan><tspan class="ch" x="52" y="62.2" style="animation-delay:105ms">U</tspan><tspan class="ch" x="86" y="62.2" style="animation-delay:150ms">L</tspan><tspan class="ch" x="120" y="62.2" style="animation-delay:195ms">D</tspan><tspan class="ch" x="154" y="62.2" style="animation-delay:240ms">E</tspan><tspan class="ch" x="188" y="62.2" style="animation-delay:285ms">E</tspan><tspan class="ch" x="222" y="62.2" style="animation-delay:330ms">P</tspan><tspan class="ch" x="18" y="130.2" style="animation-delay:375ms">A</tspan><tspan class="ch" x="52" y="130.2" style="animation-delay:420ms">H</tspan><tspan class="ch" x="86" y="130.2" style="animation-delay:465ms">L</tspan><tspan class="ch" x="120" y="130.2" style="animation-delay:510ms">A</tspan><tspan class="ch" x="154" y="130.2" style="animation-delay:555ms">W</tspan><tspan class="ch" x="188" y="130.2" style="animation-delay:600ms">A</tspan><tspan class="ch" x="222" y="130.2" style="animation-delay:645ms">T</tspan><tspan class="cursor" x="260" y="130.2">_</tspan></text></svg>